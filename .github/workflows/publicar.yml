name: Publicar en PyPI

on:
  release:
    types: [published]

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: PYTHONPATH=src python -m unittest discover -s tests -q

      # que no se suba si el tag no es la version del pyproject
      - name: Mirar la version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "${GITHUB_REF_NAME#v}" = "$VERSION" || { echo "El tag es $GITHUB_REF_NAME pero pyproject.toml dice $VERSION"; exit 1; }

      - name: Construir
        run: |
          python -m pip install build
          python -m build

      - uses: pypa/gh-action-pypi-publish@release/v1

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pantalla"
version = "0.3.0"
description = "gotoxy para el siglo XXI: colores, cajas, menús, letras ASCII, ratón, spinners y juegos sin bucles en la terminal. En español y pensada para aprender Python."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "phernandez102" }]
keywords = ["terminal", "consola", "gotoxy", "colores", "tui", "menu", "educación", "español", "conio",
            "ascii-art", "figlet", "juegos", "spinner", "raton", "principiantes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Terminals",
]

[project.urls]
"Constructor web" = "https://phernandez102.github.io/pantalla/"
"Código" = "https://github.com/phernandez102/pantalla"

[project.scripts]
pantalla-demo = "pantalla.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pantalla = ["fuentes/*.flf"]
